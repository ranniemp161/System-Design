# Deploy the TPS briefing (tps-briefing/) to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # index.html is a body fragment (the Claude artifact host adds the document head);
      # give the standalone site a doctype and mobile viewport.
      - name: Build site
        run: |
          mkdir -p _site
          cp -r tps-briefing/. _site/
          {
            echo '<!doctype html>'
            echo '<html lang="en">'
            echo '<head>'
            echo '<meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">'
            cat tps-briefing/index.html
            echo '</html>'
          } > _site/index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './_site'

  # Separate job so the uploaded artifact is fully registered before deploy looks it up
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
